<div class="right-section p-4 bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="form-container w-full max-w-2xl bg-white shadow-md rounded-lg p-8">
        <h2 class="text-2xl font-semibold text-gray-700 mb-6">Update Client</h2>
        <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" formControlName="company_name" placeholder="Enter company name" required
                    [ngClass]="{ 'invalid': submitted && clientForm.get('company_name')?.invalid }" />
                <div *ngIf="submitted && clientForm.get('company_name')?.invalid" class="error">
                    Company name is required
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="Enter email address" required
                    [ngClass]="{ 'invalid': submitted && clientForm.get('email')?.invalid }" />
                <div *ngIf="submitted && clientForm.get('email')?.invalid" class="error">
                    Please enter a valid email address
                </div>
            </div>

            <div class="form-group">
                <label>Phone (10 digits)</label>
                <input type="tel" formControlName="phone" placeholder="Enter phone number"
                    [ngClass]="{ 'invalid': submitted && clientForm.get('phone')?.invalid }" />
                <div *ngIf="submitted && clientForm.get('phone')?.invalid" class="error">
                    Please enter a valid 10-digit phone number
                </div>
            </div>

            <div class="form-group">
                <label>Website</label>
                <input type="text" formControlName="website" placeholder="Enter website" />
            </div>

            <div class="form-group">
                <label>VAT Number</label>
                <input type="text" formControlName="vat_number" placeholder="Enter VAT number" />
            </div>

            <div class="form-group">
                <label>GST Number</label>
                <input type="text" formControlName="gst_number" placeholder="Enter GST number" />
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" formControlName="address" placeholder="Enter address" />
            </div>

            <div class="form-group">
                <label>Status</label>
                <input type="text" formControlName="status" placeholder="Enter status (e.g. active)" />
            </div>

            <button type="submit" class="submit-btn">Update

            </button>
        </form>
    </div>
</div>
