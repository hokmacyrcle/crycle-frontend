<div class="w-full max-w-5xl mx-auto bg-white border rounded-lg shadow-sm">

    <!-- Header -->
    <div class="flex justify-between items-center p-4 border-b">
        <h2 class="text-lg font-semibold text-purple-700">Notes</h2>
        <button (click)="openModal()" class="px-4 py-2 text-sm bg-purple-500 text-white rounded hover:bg-purple-700">
            Add New Note
        </button>
    </div>

    <!-- Modal -->
    <div *ngIf="showModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40">
        <div class="bg-white w-96 rounded shadow-lg relative">
            <div class="flex justify-between items-center border-b px-4 py-2">
                <h2 class="text-lg font-semibold text-purple-700">Add New Note</h2>
                <button (click)="closeModal()" class="text-gray-600 text-xl">&times;</button>
            </div>
            <div class="p-4">
                <textarea [(ngModel)]="newNoteText" rows="5" maxlength="300"
                    class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400"
                    placeholder="Write your note..."></textarea>
            </div>
            <div class="flex justify-end gap-2 border-t px-4 py-2">
                <button (click)="saveNote()" class="px-4 py-2 bg-purple-500 rounded text-white hover:bg-purple-700">
                    Save
                </button>
                <button (click)="closeModal()" class="px-4 py-2 border rounded hover:bg-gray-300">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Search & Table -->
    <div class="p-4">
        <div class="flex justify-end mb-2">
            <div class="relative">
                <input type="text" [(ngModel)]="searchText" placeholder="Search notes"
                    class="border rounded-lg pl-3 pr-3 py-2 text-sm focus:ring focus:ring-blue-200">
            </div>
        </div>

        <table class="w-full text-sm border border-gray-200 rounded-lg">
            <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
                <tr>
                    <th class="px-4 py-3 text-left">Date / Time</th>
                    <th class="px-4 py-3 text-left">User</th>
                    <th class="px-4 py-3 text-left">Note</th>
                </tr>
            </thead>
            <tbody>
                <!-- Empty State -->
                <tr *ngIf="filteredNotes.length === 0">
                    <td colspan="3" class="text-center py-10 text-gray-500">
                        <div class="flex flex-col items-center space-y-2">
                            <span class="text-4xl">📝</span>
                            <p>No notes added</p>
                            <button (click)="openModal()"
                                class="px-4 py-2 text-sm bg-purple-500 text-white rounded hover:bg-purple-800">
                                Add New Note
                            </button>
                        </div>
                    </td>
                </tr>

                <!-- Notes List -->
                <tr *ngFor="let note of filteredNotes">
                    <td class="px-4 py-2">{{ note.date | date:'short' }}</td>
                    <td class="px-4 py-2">{{ note.user }}</td>
                    <td class="px-4 py-2">{{ note.text }}</td>
                </tr>
            </tbody>
        </table>

        <div class="text-sm text-gray-600 mt-3">
            Showing {{ filteredNotes.length }} Notes
        </div>
    </div>

</div>
