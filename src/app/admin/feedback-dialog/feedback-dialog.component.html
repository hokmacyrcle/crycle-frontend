<div class="p-6 w-[420px] max-w-full bg-white rounded-2xl shadow-lg">
  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-gray-900">We want to hear from you!</h2>
    <button mat-icon-button (click)="closeDialog()">
      <span class="material-icons text-gray-400 hover:text-gray-600 transition">close</span>
    </button>
  </div>

  <!-- Subtext -->
  <p class="text-sm text-gray-600 mb-5">
    We’re working on making transactions even better, and would love your feedback.
  </p>

  <!-- Feedback textarea -->
  <textarea
    [(ngModel)]="feedbackText"
    rows="5"
    placeholder="Type your feedback here..."
    class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
  ></textarea>

  <!-- Action buttons -->
  <div class="mt-6 flex justify-end space-x-3">
    <!-- Cancel button -->
    <button
      mat-stroked-button
      class="rounded-lg border-gray-300 text-gray-700 hover:bg-gray-100 px-4 py-2 text-sm"
      (click)="closeDialog()"
    >
      Cancel
    </button>

    <!-- Submit button -->
    <button
      mat-raised-button
      color="primary"
      class="bg-primary-purple-300 hover:bg-purple-700 text-white font-medium rounded-lg shadow px-5 py-2 text-sm transition"
      (click)="submitFeedback()"
    >
      Submit Feedback
    </button>
  </div>
</div>
