<router-outlet></router-outlet>

<div *ngIf="isLoading" class="text-blue-500 text-center font-semibold">
    Loading employees...
</div>

<div *ngIf="errorMessage" class="text-red-500 text-center font-semibold">
    {{ errorMessage }}
</div>


<div *ngIf="!timesheetData && !hasChild" class="p-6">
    <h2 class="text-xl font-bold mb-6 text-purple-600">Timesheets</h2>
    <div class="shadow-md border p-6 max-w-6xl mx-auto">
        <form class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div>
                <label class="block text-sm mb-1">Timesheet Filter</label>
                <select class="w-full border rounded px-3 py-2 text-gray-600">
                    <option value="">(all)</option>
                    <option value="approved">Approved</option>
                    <option value="pending">Pending</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div>
                <label class="block text-sm mb-1">Start Date</label>
                <input type="date" class="w-full border rounded px-3 py-2 text-gray-600" />
            </div>
            <div>
                <label class="block text-sm mb-1">End Date</label>
                <input type="date" class="w-full border rounded px-3 py-2 text-gray-600" />
            </div>
            <div>
                <label class="block text-sm mb-1">Employee Group</label>
                <select class="w-full border rounded px-3 py-2 text-gray-600">
                    <option value="">(all)</option>
                    <option value="dev">Developers</option>
                    <option value="hr">HR</option>
                    <option value="sales">Sales</option>
                </select>
            </div>
            <div>
                <label class="block text-sm mb-1">Employee/s</label>
                <input type="text" placeholder="Enter employee name"
                    class="w-full border rounded px-3 py-2 text-gray-600" />
            </div>
        </form>
        <div class="flex justify-end mt-6 space-x-3">
            <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                Reset Filter
            </button>
            <button type="submit" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-700">
                Apply Filter
            </button>
        </div>
    </div>
    <button class="m-4 px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-700" (click)="openModal()">
        + Add Timesheet
    </button>
    <div class="shadow-md border max-w-6xl mx-auto">
        <!-- Approve Section -->
        <div class=" bg-gray-50 p-3 flex items-center space-x-3">
            <button class="px-3 py-1.5 bg-purple-500 text-white rounded">
                Approve
            </button>
        </div>

        <!-- Table -->
        <div class="border overflow-x-auto">
            <table class="min-w-full text-sm text-left">
                <thead class="bg-gray-100 border-b text-gray-600">
                    <tr>
                        <th class="px-4 py-2">
                            <input type="checkbox" />
                        </th>
                        <th class="px-4 py-2">First Name</th>
                        <th class="px-4 py-2">Surname</th>
                        <th class="px-4 py-2">Period</th>
                        <th class="px-4 py-2">Status</th>
                        <th class="px-4 py-2">Last Edited</th>
                        <th class="px-4 py-2">Hours</th>
                    </tr>
                </thead>

                <!-- <tbody>
                    <tr *ngFor="let ts of timesheets; let i = index"
                        class="border-b hover:bg-gray-50 text-gray-600 cursor-pointer"
                        routerLink="payroll-timesheet-details">
                        <td class="px-4 py-2">
                            <input type="checkbox" [(ngModel)]="ts.selected" (click)="$event.stopPropagation()"
                                (change)="onCheckboxChange()" />
                        </td>
                        <td class="px-4 py-2">{{ts.firstName}}</td>
                        <td class="px-4 py-2">{{ts.surname}}</td>
                        <td class="px-4 py-2">{{ts.period}}</td>
                        <td class="px-4 py-2">{{ts.status}}</td>
                        <td class="px-4 py-2">{{ts.lastEdited}}</td>
                        <td class="px-4 py-2">{{ts.hours}}</td>
                    </tr>
                </tbody> -->
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
        <button class="absolute top-4 right-4 text-red-500 text-3xl hover:text-red-700"
            (click)="closeModal()">✖</button>

        <h2 class="text-lg font-semibold mb-4">Add Timesheet</h2>

        <form (ngSubmit)="onAdd()" class="space-y-4">
            <!-- Employee -->
            <div *ngIf="!isLoading && !errorMessage && employees.length > 0" class="mb-4">
                <label class="block font-medium mb-2">Select Employee</label>
                <select [(ngModel)]="selectedEmployee" name="employee" class="border p-2 rounded w-full">
                    <option value="">-- Select Employee --</option>
                    <option *ngFor="let emp of employees" [value]="emp.employee_id">
                        {{ emp.first_name }} {{ emp.last_name }}
                    </option>
                </select>
            </div>

            <!-- Period -->
            <div class="mb-4">
                <label class="block font-medium mb-2">Select Period</label>
                <select [(ngModel)]="selectedPeriod" name="period" class="border p-2 rounded w-full">
                    <option value="">-- Select Period --</option>
                    <option *ngFor="let p of periods" [value]="p">{{ p }}</option>
                </select>
            </div>

            <div class="flex justify-end space-x-3">
                <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
                    (click)="closeModal()">Cancel</button>
                <button type="submit" [disabled]="!selectedEmployee || !selectedPeriod" [ngClass]="{
              'bg-purple-600 text-white hover:bg-purple-700': selectedEmployee && selectedPeriod,
              'bg-gray-300 text-gray-500 cursor-not-allowed': !selectedEmployee || !selectedPeriod
            }" class="px-4 py-2 rounded">
                    Add
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Child Component -->
<app-payroll-timesheet-details *ngIf="timesheetData" [employeeId]="timesheetData.employee_id"
    [period]="timesheetData.period">
</app-payroll-timesheet-details>
