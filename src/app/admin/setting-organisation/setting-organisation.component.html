<div class="shadow-sm p-8 border space-y-6 w-2/3 mx-auto">

    <!-- Section: Organisation -->
    <h2 class="text-lg font-semibold text-purple-700 border-b">Organisation</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium">Bank Account</label>
            <select class="w-full border rounded p-2" formControlName="bankAccount">
                <option>090: Business Bank Account</option>
                <option>091: Saving Account</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">PAYG Liability Account</label>
            <select class="w-full border rounded p-2" formControlName="paygLiability">
                <option>825: PAYG Withholdings Payable</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">Wages Expense Account</label>
            <select class="w-full border rounded p-2" formControlName="wagesExpense">
                <option>477: Wages and Salaries</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">Wages Payable Account</label>
            <select class="w-full border rounded p-2" formControlName="wagesPayable">
                <option>804: Wages Payable - Payroll</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">Superannuation Liability Account</label>
            <select class="w-full border rounded p-2" formControlName="superLiability">
                <option>826: Superannuation Payable</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">Superannuation Expense Account</label>
            <select class="w-full border rounded p-2" formControlName="superExpense">
                <option>478: Superannuation</option>
            </select>
        </div>
    </div>

    <!-- Section: Payroll Tracking -->
    <h2 class="text-lg font-semibold text-purple-700 border-b">Payroll Tracking</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium">Employee Groups (optional)</label>
            <select class="w-full border rounded p-2" formControlName="employeeGroup">
                <option>None</option>
                <option>Group A</option>
                <option>Group B</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium">Timesheet Categories (optional)</label>
            <select class="w-full border rounded p-2" formControlName="timesheetCategory">
                <option>None</option>
                <option>Category A</option>
                <option>Category B</option>
            </select>
        </div>
    </div>

    <!-- Section: Payslip Options -->
    <h2 class="text-lg font-semibold text-purple-700 border-b">Payslip Options</h2>
    <div class="flex items-center space-x-6">
        <label class="flex items-center space-x-2">
            <input type="checkbox" formControlName="showAnnualSalary" class="h-4 w-4 text-green-600">
            <span class="text-sm">Show Annual Salary</span>
        </label>

        <label class="flex items-center space-x-2">
            <input type="checkbox" formControlName="showEmploymentBasis" class="h-4 w-4 text-green-600">
            <span class="text-sm">Show Employment Basis</span>
        </label>
    </div>

    <!-- Section: Company Logo -->
    <h2 class="text-lg font-semibold text-purple-700 border-b">Company Logo</h2>
    <p class="text-sm  mb-2">Your company logo will be used on things like payslips. (optional)</p>
    <textarea rows="4" class="w-full border rounded p-2" placeholder="Upload Logo or paste URL"
        formControlName="companyLogo"></textarea>
    <button class="mt-2 px-4 py-2 border border-gray-400 rounded text-sm">Upload Logo</button>

    <!-- Footer Buttons -->
    <div class="flex justify-end space-x-4 mt-6">
        <button class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded">Save</button>
        <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded">Close</button>
    </div>
</div>
<!-- History Section -->
<div class="w-2/3 mx-auto m-2 shadow-sm">
    <div class="border rounded">
        <button (click)="toggleHistory()"
            class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-gray-100 rounded-t text-left">
            <span class="font-medium text-purple-800">History</span>
            <span [class.rotate-180]="showHistory" class="transition-transform">⌄</span>
        </button>
        <div *ngIf="showHistory" class="px-4 py-3 bg-white">
            <table class="min-w-full text-sm text-left">
                <thead>
                    <tr>
                        <th class="px-4 py-2">Date</th>
                        <th class="px-4 py-2">User</th>
                        <th class="px-4 py-2">Item</th>
                        <th class="px-4 py-2">Detail</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="px-4 py-2">21 Aug 2025</td>
                        <td class="px-4 py-2">Rakesh Chandra T</td>
                        <td class="px-4 py-2">Contact information</td>
                        <td class="px-4 py-2">
                            <span class="block">Added address:</span>
                            <span class="block">'123 Main St, St. Kilda'</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
