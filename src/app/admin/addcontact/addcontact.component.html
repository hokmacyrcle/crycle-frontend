<div [ngClass]="isDialog ? 'bg-gray-50 flex items-center justify-center' : 'bg-gray-50 min-h-screen w-full p-6'">
    <div class="form-containers" [ngClass]="{ 'full-width': !isDialog }">
        <button *ngIf="isDialog" type="button" (click)="onClose()" aria-label="Close"
            class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
            &#10005;
        </button>

        <h1 style="text-align: center;">{{ isEditMode ? 'Update Contact' : 'Add Contact' }}</h1>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <!-- Contact Basic Info -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Company ID</label>
                    <input type="number" formControlName="company_id" placeholder="Enter company ID"
                        class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('company_id')?.invalid }" />
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('company_id')?.errors?.['required']">
                        Company ID is required.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">Contact Type</label>
                    <select formControlName="contact_type" class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_type')?.invalid }">
                        <option value="">Select type</option>
                        <option>Individual</option>
                        <option>Company</option>
                    </select>
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_type')?.errors?.['required']">
                        Contact type is required.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">First Name</label>
                    <input type="text" formControlName="contact_first_name" placeholder="Enter first name"
                        class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_first_name')?.invalid }" />
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_first_name')?.errors?.['required']">
                        First name is required.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">Middle Name</label>
                    <input type="text" formControlName="contact_middle_name" placeholder="Enter middle name"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Last Name</label>
                    <input type="text" formControlName="contact_last_name" placeholder="Enter last name"
                        class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_last_name')?.invalid }" />
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_last_name')?.errors?.['required']">
                        Last name is required.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">Company Name</label>
                    <input type="text" formControlName="contact_company_name" placeholder="Enter company name"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <!-- Contact Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Email</label>
                    <input type="email" formControlName="contact_email_address" placeholder="Enter email"
                        class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_email_address')?.invalid }" />
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_email_address')?.errors?.['required']">
                        Email is required.
                    </div>
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_email_address')?.errors?.['email']">
                        Enter a valid email address.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">Phone</label>
                    <input type="text" formControlName="contact_phone_number" placeholder="Enter phone"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Mobile</label>
                    <input type="text" formControlName="contact_mobile_number" placeholder="Enter mobile"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
                <div>
                    <label class="block mb-1">Category</label>
                    <select formControlName="contact_category" class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_category')?.invalid }">
                        <option value="">Select category</option>
                        <option>Client</option>
                        <option>Supplier</option>
                        <option>Partner</option>
                    </select>
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_category')?.errors?.['required']">
                        Category is required.
                    </div>
                </div>
            </div>

            <!-- Address -->
            <div class="mb-4">
                <label class="block mb-1">Address Line 1</label>
                <input type="text" formControlName="contact_address_line_1" placeholder="Address line 1"
                    class="w-full p-2 border border-gray-300 rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Address Line 2</label>
                <input type="text" formControlName="contact_address_line_2" placeholder="Address line 2"
                    class="w-full p-2 border border-gray-300 rounded" />
            </div>
            <div class="mb-4">
                <label class="block mb-1">Address Line 3</label>
                <input type="text" formControlName="contact_address_line_3" placeholder="Address line 3"
                    class="w-full p-2 border border-gray-300 rounded" />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">City</label>
                    <input type="text" formControlName="contact_city" placeholder="City"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
                <div>
                    <label class="block mb-1">State</label>
                    <input type="text" formControlName="contact_state" placeholder="State"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Post Code</label>
                    <input type="text" formControlName="contact_post_code" placeholder="Post code"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
                <div>
                    <label class="block mb-1">Country</label>
                    <input type="text" formControlName="contact_country" placeholder="Country"
                        class="w-full p-2 border border-gray-300 rounded" />
                </div>
            </div>

            <!-- Status and Subscriber -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block mb-1">Status</label>
                    <select formControlName="contact_status" class="w-full p-2 border rounded"
                        [ngClass]="{ 'border-red-500': submitted && contactForm.get('contact_status')?.invalid }">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                    <div class="text-red-500 text-sm mt-1"
                        *ngIf="submitted && contactForm.get('contact_status')?.errors?.['required']">
                        Status is required.
                    </div>
                </div>
                <div>
                    <label class="block mb-1">Subscriber Client</label>
                    <input type="checkbox" formControlName="subscriber_client" class="p-2" />
                </div>
            </div>

            <div class="mb-4">
                <label class="block mb-1">Subscriber ID</label>
                <input type="number" formControlName="subscriber_id" placeholder="Enter subscriber ID"
                    class="w-full p-2 border border-gray-300 rounded" />
            </div>

            <!-- Submit -->
            <button class="submit-btn bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700" type="submit"
                [disabled]="isSubmitting">
                {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Contact' : 'Save Contact') }}
            </button>
        </form>
    </div>
</div>
