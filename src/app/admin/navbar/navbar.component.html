<!-- navbar.component.html -->
<nav class="bg-white drop-shadow-md px-4 py-2 flex items-center justify-between w-full h-[70px] border-b">
  <div class="flex items-center gap-6">
    <a routerLink="/admin/Dashboard" aria-label="Cyrcle home"><img src="assets/images/brand/cyrcle-lockup-navy.svg" alt="Cyrcle" class="h-9 w-auto"></a>
    <a routerLink="/company-selection" class="hidden sm:flex h-10 items-center gap-2.5 rounded-full bg-cyrcle-cream px-4 text-sm font-bold text-cyrcle-navy" title="Switch business"><app-icon name="swap" [size]="18"></app-icon><span>{{ session.companyName }}</span><span class="font-medium text-[#3C4663]">· {{ session.context === 'firm' ? 'Firm level' : 'Inside a client' }}</span></a>
  </div>
  <div class="flex items-center gap-6">
    <a routerLink="/admin/settings" class="cy-icon-btn" title="Settings" aria-label="Settings"><app-icon name="settings" [size]="22"></app-icon></a>

    <div class="relative" (click)="toggleDropdown()" (document:click)="onDocumentClick($event)">
      <div class="flex items-center gap-2 cursor-pointer select-none">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-cyrcle-navy text-sm font-bold text-white" aria-hidden="true">{{ initials }}</span>
        <span class="hidden sm:inline text-sm font-medium text-cyrcle-navy">{{ session.userName }}</span>
      </div>

      <!-- Dropdown Menu -->
      <div *ngIf="showDropdown" class="absolute right-0 mt-2 w-48 bg-white border rounded-md shadow-lg z-50">
        <a routerLink="/admin/settings" class="block px-4 py-2.5 text-sm font-semibold text-cyrcle-navy hover:bg-[#F6F4EC]">Settings</a>
        <a routerLink="/company-selection" class="block px-4 py-2.5 text-sm font-semibold text-cyrcle-navy hover:bg-[#F6F4EC]">Switch business</a>
        <div class="border-t my-1"></div>
        <button type="button" class="block w-full px-4 py-2.5 text-left text-sm font-semibold text-red-700 hover:bg-red-50" (click)="logout()">Sign out</button>
      </div>
    </div>

    <!-- <div class="flex items-center gap-4">
      <img src="assets/images/Dashboard/userlogo.png" alt="User" class="w-8 h-8 rounded-full" />
      <span class="hidden sm:inline text-sm font-medium text-cyrcle-navy">{{ session.userName }}</span>
    </div> -->
  </div>
</nav>
