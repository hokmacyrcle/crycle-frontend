<div class="mx-auto max-w-5xl text-cyrcle-navy">
  <div class="flex items-center justify-between gap-3">
    <h1 class="m-0 text-[28px] font-extrabold leading-tight">Sales</h1>
    <div class="flex gap-2">
      <a routerLink="/admin/sales/quotes/new" class="cy-btn-secondary hidden sm:inline-flex">New quote</a>
      <a routerLink="/admin/sales/invoices/new" class="cy-btn-primary"><app-icon name="plus" [size]="18"></app-icon>New invoice</a>
    </div>
  </div>

  <nav class="mt-4 flex gap-1 overflow-x-auto overflow-y-hidden border-b border-cyrcle-pearl" aria-label="Sales sections">
    <a *ngFor="let t of tabs" [routerLink]="t.link" routerLinkActive #rla="routerLinkActive" [routerLinkActiveOptions]="{ exact: t.exact }"
       class="-mb-px whitespace-nowrap border-b-[3px] px-3 py-3 text-sm sm:px-4 font-bold"
       [ngClass]="rla.isActive ? 'border-cyrcle-poppy text-cyrcle-navy' : 'border-transparent text-[#5B6478] hover:text-cyrcle-navy'"
       [attr.aria-current]="rla.isActive ? 'page' : null">{{ t.label }}</a>
  </nav>

  <div class="mt-5"><router-outlet></router-outlet></div>
</div>
