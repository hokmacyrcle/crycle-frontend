<aside id="sidebar" class="w-[140px] bg-white" aria-label="Main menu">
  <a *ngFor="let menu of menuItems" [routerLink]="menu.route"
     class="relative flex min-h-[84px] flex-col items-center justify-center gap-1.5 border-b border-cyrcle-pearl px-2 text-center text-[13px] text-cyrcle-navy hover:bg-[#F6F4EC]"
     [ngClass]="isActive(menu) ? 'bg-[#F6F4EC] font-extrabold text-cyrcle-royal' : 'font-semibold'"
     [attr.aria-current]="isActive(menu) ? 'page' : null">
    <span *ngIf="isActive(menu)" class="absolute inset-y-3.5 left-0 w-1 rounded-r bg-cyrcle-poppy"></span>
    <app-icon [name]="menu.icon" [size]="26"></app-icon>
    <span>{{ menu.label }}</span>
  </a>
</aside>
