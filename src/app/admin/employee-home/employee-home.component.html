<div class="max-w-xl mx-auto">
  <div class="bg-cyrcle-metal text-white rounded-2xl p-5 mb-5">
    <p class="text-sm opacity-80 !m-0">Welcome back</p>
    <h1 class="text-2xl mt-1 !mb-0">{{ session.userName }}</h1>
    <p class="text-sm mt-1 !mb-0 opacity-80" *ngIf="session.companyName">{{ session.companyName }}</p>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div *ngFor="let t of tiles" class="bg-white rounded-2xl p-4 shadow-sm border border-cyrcle-pearl">
      <span class="material-icons text-cyrcle-royal text-3xl">{{ t.icon }}</span>
      <p class="font-semibold mt-2 !mb-0 text-cyrcle-navy">{{ t.label }}</p>
      <p class="text-xs text-cyrcle-chestnut mt-0.5 !mb-0">{{ t.hint }}</p>
    </div>
  </div>
</div>
