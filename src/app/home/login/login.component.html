<div class="mx-auto flex min-h-screen max-w-md flex-col bg-[#F6F4EC] text-cyrcle-navy">
  <div class="flex justify-center px-5 pt-[calc(env(safe-area-inset-top)+40px)]">
    <img src="assets/images/brand/cyrcle-lockup-navy.svg" alt="Cyrcle" class="h-14 w-auto">
  </div>

  <div class="px-5 pt-8">
    <h1 class="m-0 text-[26px] font-extrabold leading-tight">Log in</h1>
    <p class="mt-2 text-[15px] leading-snug text-[#3C4663]">Welcome back to Cyrcle.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="flex flex-1 flex-col" novalidate>
    <div class="flex flex-col gap-3.5 px-5 pt-5">
      <label class="block">
        <div class="mb-1.5 text-[13px] font-bold">Email address</div>
        <input type="email" name="email" [(ngModel)]="email" required email autocomplete="username" #emailField="ngModel"
          class="h-[52px] w-full rounded-[14px] border-[1.5px] bg-white px-4 text-base text-cyrcle-navy outline-none focus:border-cyrcle-navy"
          [ngClass]="(loginForm.submitted || emailField.touched) && emailField.invalid ? 'border-red-600' : 'border-[#B9B39F]'">
        <div *ngIf="(loginForm.submitted || emailField.touched) && emailField.invalid" class="mt-1 text-xs font-semibold text-red-700">Enter your email address</div>
      </label>

      <label class="block">
        <div class="mb-1.5 text-[13px] font-bold">Password</div>
        <div class="relative">
          <input [type]="passwordType" name="password" [(ngModel)]="password" required autocomplete="current-password" #passwordField="ngModel"
            class="h-[52px] w-full rounded-[14px] border-[1.5px] bg-white pl-4 pr-20 text-base text-cyrcle-navy outline-none focus:border-cyrcle-navy"
            [ngClass]="(loginForm.submitted || passwordField.touched) && passwordField.invalid ? 'border-red-600' : 'border-[#B9B39F]'">
          <button type="button" (click)="passwords()" class="absolute right-2 top-1/2 h-11 -translate-y-1/2 px-3 text-sm font-bold text-cyrcle-midnight">{{ passwordshown ? 'Hide' : 'Show' }}</button>
        </div>
        <div *ngIf="(loginForm.submitted || passwordField.touched) && passwordField.invalid" class="mt-1 text-xs font-semibold text-red-700">Enter your password</div>
      </label>
    </div>

    <div class="mt-auto flex flex-col gap-1.5 px-4 pb-8 pt-8">
      <button type="submit" [disabled]="loading" class="flex h-[52px] items-center justify-center rounded-full bg-cyrcle-poppy text-[15px] font-bold text-cyrcle-navy disabled:opacity-60">{{ loading ? 'Please wait…' : 'Log in' }}</button>
      <a routerLink="/signup" class="py-1.5 text-center text-sm font-semibold text-cyrcle-midnight underline">New to Cyrcle? Register your firm</a>
    </div>
  </form>
</div>
