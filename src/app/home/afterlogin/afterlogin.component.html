<div class="mx-auto flex min-h-screen max-w-md flex-col bg-[#F6F4EC] text-cyrcle-navy">
  <div class="flex justify-center px-5 pt-[calc(env(safe-area-inset-top)+40px)]">
    <img src="assets/images/brand/cyrcle-lockup-navy.svg" alt="Cyrcle" class="h-12 w-auto">
  </div>

  <div class="px-5 pt-8">
    <h1 class="m-0 text-[26px] font-extrabold leading-tight">Choose a business</h1>
    <p class="mt-2 text-[15px] leading-snug text-[#3C4663]">Pick the business you want to work on. You can switch any time.</p>
  </div>

  <div class="px-5 pt-5" *ngIf="companies.length > 6">
    <label class="block">
      <span class="sr-only">Search businesses</span>
      <input type="search" placeholder="Search businesses" [(ngModel)]="searchTerm" (input)="filterCompanies()"
        class="h-[52px] w-full rounded-[14px] border-[1.5px] border-[#B9B39F] bg-white px-4 text-base outline-none focus:border-cyrcle-navy">
    </label>
  </div>

  <ul class="m-0 flex list-none flex-col gap-2.5 p-0 px-5 pt-5">
    <li *ngFor="let company of filteredCompanies">
      <button type="button" (click)="selectCompany(company)" [disabled]="loading"
        class="flex min-h-[72px] w-full items-center gap-3.5 rounded-[20px] bg-white px-4 py-3 text-left disabled:opacity-60">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-cyrcle-navy text-base font-bold text-white">{{ company.company_name?.charAt(0) | uppercase }}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[15px] font-bold">{{ company.company_name }}</span>
          <span class="block text-[13px] text-[#5B6478]">{{ company.company_type === 'Subscriber' ? 'Your firm' : 'Client business' }}</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#01153E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </li>
    <li *ngIf="filteredCompanies.length === 0" class="rounded-[20px] border-2 border-dashed border-[#B9B39F] p-5 text-sm text-[#3C4663]">
      No businesses found.
    </li>
  </ul>

  <div class="mt-auto px-4 pb-8 pt-8 text-center">
    <button type="button" (click)="signOut()" [disabled]="loading" class="py-2 text-sm font-semibold text-cyrcle-midnight underline">Log in with a different account</button>
  </div>
</div>
